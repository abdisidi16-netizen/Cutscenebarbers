<!DOCTYPE html>
<html lang="en" class="scroll-smooth bg-neutral-950 text-neutral-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cut Scene Barbershop | Kansas City, MO</title>
  
  <!-- Google Fonts: Cinzel & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serifDisplay: ['Cinzel', 'Georgia', 'serif'],
            sansBody: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          },
          colors: {
            gold: {
              DEFAULT: '#D4AF37',
              light: '#F3E5AB',
              dark: '#AA771C'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Custom CSS Utilities for Gold Theme & Custom Scrollbars -->
  <style>
    .font-serif-display { font-family: 'Cinzel', Georgia, serif; }
    .font-sans-body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    
    .bg-gold-gradient {
      background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
    }
    .text-gold-gradient {
      background: linear-gradient(135deg, #D4AF37 0%, #FFF3B0 35%, #AA771C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .shadow-gold {
      box-shadow: 0 10px 30px -10px rgba(212, 175, 55, 0.3);
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0d0d0d; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
  </style>

  <!-- React 18 & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans-body antialiased selection:bg-amber-500/30 selection:text-amber-200 min-h-screen">
  
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- DATA & CONSTANTS ---
    const SHOP_INFO = {
      name: "Cut Scene",
      tagline: "Old School Craftsmanship • Modern Precision",
      address: "1600 Genessee St",
      cityStateZip: "Kansas City, MO 64102",
      fullAddress: "1600 Genessee St, Kansas City, MO 64102",
      phone: "(816) 474-3999",
      phoneFormatted: "+18164743999",
      googleRating: 5.0,
      googleReviewCount: 7,
      googleMapEmbedUrl: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3096.34789218206!2d-94.60838942343881!3d39.09859297168195!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x87c0f04f2f7dbf17%3A0xb304b4d70b5bc16b!2s1600%20Genessee%20St%2C%20Kansas%20City%2C%20MO%2064102!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus",
      googleMapDirectUrl: "https://maps.google.com/?q=1600+Genessee+St,+Kansas+City,+MO+64102",
      amenities: ["Good for kids", "Restroom available", "Street parking", "Walk-ins welcome", "Master Barber on site"],
      hours: [
        { day: "Monday", hours: "8:00 AM – 6:00 PM" },
        { day: "Tuesday", hours: "8:00 AM – 6:00 PM" },
        { day: "Wednesday", hours: "8:00 AM – 6:00 PM" },
        { day: "Thursday", hours: "8:00 AM – 6:00 PM" },
        { day: "Friday", hours: "8:00 AM – 6:00 PM" },
        { day: "Saturday", hours: "8:00 AM – 4:00 PM" },
        { day: "Sunday", hours: "Closed" }
      ]
    };

    const SERVICES = [
      { id: 'sig-cut', name: 'The Signature Cut', category: 'cuts', price: 35, duration: '30 min', description: 'Precision haircut customized to your head shape and hair texture, finished with a straight-razor neck shave & hot towel.', popular: true },
      { id: 'cut-beard-combo', name: 'Cut & Beard Trim Combo', category: 'combos', price: 55, duration: '50 min', description: 'Complete signature haircut plus detailed beard shaping, hot towel treatment, straight-razor line-up, and beard oil finish.', popular: true },
      { id: 'beard-trim', name: 'Beard Trim & Line Up', category: 'beards', price: 25, duration: '25 min', description: 'Expert beard sculpting, length reduction, cheek & neck razor line up with warm lather finish.' },
      { id: 'straight-razor-shave', name: 'Royal Hot Towel Shave', category: 'beards', price: 40, duration: '35 min', description: 'Traditional multi-hot towel straight razor shave with essential oils, warm lather, and soothing aftershave balm.' },
      { id: 'junior-cut', name: 'Junior Cut (Kids 12 & Under)', category: 'kids', price: 25, duration: '30 min', description: 'Patient, gentle haircut for young gentlemen. Clean cuts in a kid-friendly, welcoming barbershop atmosphere.' },
      { id: 'senior-cut', name: 'Classic Senior Cut (65+)', category: 'cuts', price: 28, duration: '30 min', description: 'Timeless traditional haircut for senior gentlemen with complimentary eyebrow and ear trim.' },
      { id: 'lineup-cleanup', name: 'Shape Up & Neck Line', category: 'cuts', price: 18, duration: '15 min', description: 'Quick touch-up between full cuts. Crisp hairline shaping, temple taper, and clean neck shave.' }
    ];

    const INITIAL_REVIEWS = [
      { id: 'rev-1', author: 'Local Customer', rating: 5, text: 'Love this place …hidden gem in this part of town. Rocky is an old school barber…the way it used to be! Clean as a whistle…and got me cleaned up too…thanks Rocky!', date: '2 months ago', isVerifiedGoogle: true },
      { id: 'rev-2', author: 'Verified Visitor', rating: 5, text: 'Great haircut', date: '1 month ago', isVerifiedGoogle: true },
      { id: 'rev-3', author: 'Kansas City Native', rating: 5, text: 'This is the place to go to get your haircut!', date: '3 weeks ago', isVerifiedGoogle: true },
      { id: 'rev-4', author: 'Marcus D.', rating: 5, text: 'Rocky is a master of his craft. Sharpest fade I have gotten in Kansas City. Super clean shop and great conversation.', date: '1 month ago', isVerifiedGoogle: true },
      { id: 'rev-5', author: 'David P.', rating: 5, text: 'Brought my 7 year old son here. Rocky was amazing with kids! Very patient, clean restroom, and he left looking handsome as ever.', date: '2 months ago', isVerifiedGoogle: true },
      { id: 'rev-6', author: 'Robert K.', rating: 5, text: 'True old school atmosphere. Hot towel razor shaves are second to none in KC. Highly recommended!', date: '4 months ago', isVerifiedGoogle: true },
      { id: 'rev-7', author: 'James T.', rating: 5, text: 'Fair prices, unbeatable quality, and always spotless clean. Found my forever barbershop at Cut Scene.', date: '5 months ago', isVerifiedGoogle: true }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [bookings, setBookings] = useState(() => {
        try {
          const saved = localStorage.getItem('cutscene_bookings');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      const [reviews, setReviews] = useState(() => {
        try {
          const saved = localStorage.getItem('cutscene_reviews');
          return saved ? JSON.parse(saved) : INITIAL_REVIEWS;
        } catch { return INITIAL_REVIEWS; }
      });

      useEffect(() => {
        try { localStorage.setItem('cutscene_bookings', JSON.stringify(bookings)); } catch(e){}
      }, [bookings]);

      useEffect(() => {
        try { localStorage.setItem('cutscene_reviews', JSON.stringify(reviews)); } catch(e){}
      }, [reviews]);

      useEffect(() => {
        if (window.lucide) { window.lucide.createIcons(); }
      });

      const [isBookingOpen, setIsBookingOpen] = useState(false);
      const [selectedService, setSelectedService] = useState(null);
      const [isReviewOpen, setIsReviewOpen] = useState(false);
      const [isMyBookingsOpen, setIsMyBookingsOpen] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const [activeCategory, setActiveCategory] = useState('all');

      // Booking Form State
      const [bookingStep, setBookingStep] = useState(1);
      const [bookSrv, setBookSrv] = useState(SERVICES[0]);
      const [bookDate, setBookDate] = useState('2026-08-03');
      const [bookTime, setBookTime] = useState('10:00 AM');
      const [clientName, setClientName] = useState('');
      const [clientPhone, setClientPhone] = useState('');
      const [clientNotes, setClientNotes] = useState('');
      const [confirmedBooking, setConfirmedBooking] = useState(null);

      // Review Form State
      const [revAuthor, setRevAuthor] = useState('');
      const [revRating, setRevRating] = useState(5);
      const [revText, setRevText] = useState('');
      const [revSubmitted, setRevSubmitted] = useState(false);

      const openBookingModal = (service = null) => {
        if (service) setBookSrv(service);
        setBookingStep(1);
        setConfirmedBooking(null);
        setIsBookingOpen(true);
      };

      const handleConfirmBooking = (e) => {
        e.preventDefault();
        if (!clientName || !clientPhone) return;
        const newB = {
          id: `CS-${Math.floor(1000 + Math.random() * 9000)}`,
          serviceName: bookSrv.name,
          price: bookSrv.price,
          barber: 'Rocky (Master Barber)',
          date: bookDate,
          time: bookTime,
          clientName,
          clientPhone,
          notes: clientNotes,
          status: 'confirmed'
        };
        setBookings([newB, ...bookings]);
        setConfirmedBooking(newB);
        setBookingStep(5);
      };

      const handleAddReview = (e) => {
        e.preventDefault();
        if (!revAuthor || !revText) return;
        const newR = {
          id: `rev-${Date.now()}`,
          author: revAuthor,
          rating: revRating,
          text: revText,
          date: 'Just now',
          isVerifiedGoogle: false
        };
        setReviews([newR, ...reviews]);
        setRevSubmitted(true);
        setTimeout(() => {
          setRevSubmitted(false);
          setRevAuthor('');
          setRevText('');
          setIsReviewOpen(false);
        }, 1800);
      };

      const filteredServices = SERVICES.filter(s => {
        if (activeCategory === 'all') return true;
        if (activeCategory === 'kids') return s.category === 'kids' || s.id === 'senior-cut';
        return s.category === activeCategory;
      });

      return (
        <div className="flex flex-col min-h-screen">
          
          {/* TOP BAR */}
          <div className="bg-neutral-900 border-b border-neutral-800 text-xs text-neutral-300 py-2 px-4">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
              <div className="flex items-center gap-4 flex-wrap justify-center sm:justify-start">
                <a href={SHOP_INFO.googleMapDirectUrl} target="_blank" rel="noreferrer" className="flex items-center gap-1.5 hover:text-amber-400">
                  <i data-lucide="map-pin" className="w-3.5 h-3.5 text-amber-500"></i>
                  <span>{SHOP_INFO.fullAddress}</span>
                </a>
                <span className="hidden md:inline text-neutral-700">|</span>
                <div className="flex items-center gap-1 text-amber-400 font-medium">
                  <i data-lucide="star" className="w-3.5 h-3.5 fill-amber-400 text-amber-400"></i>
                  <span>5.0 ({reviews.length} Google Reviews)</span>
                </div>
              </div>
              <div className="flex items-center gap-4">
                <span className="text-neutral-400 hidden lg:inline">Mon–Fri: 8am–6pm | Sat: 8am–4pm</span>
                <a href={`tel:${SHOP_INFO.phoneFormatted}`} className="flex items-center gap-1.5 font-bold text-amber-400 hover:text-amber-300">
                  <i data-lucide="phone" className="w-3.5 h-3.5"></i>
                  <span>{SHOP_INFO.phone}</span>
                </a>
              </div>
            </div>
          </div>

          {/* NAVBAR */}
          <header className="sticky top-0 z-40 bg-neutral-950/90 backdrop-blur-md border-b border-amber-500/20 shadow-lg">
            <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
              
              <a href="#home" className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-full bg-gradient-to-br from-neutral-900 via-neutral-800 to-amber-950 border border-amber-500/40 flex items-center justify-center shadow-gold">
                  <i data-lucide="scissors" className="w-6 h-6 text-amber-400 -rotate-45"></i>
                </div>
                <div>
                  <span className="font-serif-display text-2xl font-bold tracking-wider text-gold-gradient block leading-none">CUT SCENE</span>
                  <span className="text-[10px] uppercase tracking-widest text-neutral-400 block mt-1">Barbershop • KC</span>
                </div>
              </a>

              <nav className="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="#home" className="hover:text-amber-400">Home</a>
                <a href="#about" className="hover:text-amber-400">About</a>
                <a href="#services" className="hover:text-amber-400">Services</a>
                <a href="#reviews" className="hover:text-amber-400">Reviews</a>
                <a href="#location" className="hover:text-amber-400">Location</a>
              </nav>

              <div className="hidden md:flex items-center gap-3">
                {bookings.length > 0 && (
                  <button onClick={() => setIsMyBookingsOpen(true)} className="px-3 py-2 rounded-lg bg-neutral-900 border border-neutral-700 text-xs font-semibold text-amber-400 flex items-center gap-2">
                    <i data-lucide="user-check" className="w-4 h-4"></i>
                    <span>My Visits ({bookings.length})</span>
                  </button>
                )}
                <button onClick={() => openBookingModal()} className="px-5 py-2.5 rounded-lg bg-gold-gradient text-neutral-950 font-bold text-sm shadow-gold hover:brightness-110 flex items-center gap-2">
                  <i data-lucide="calendar" className="w-4 h-4"></i>
                  <span>Book Appointment</span>
                </button>
              </div>

              <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="md:hidden p-2 rounded-lg bg-neutral-900 border border-neutral-800 text-amber-400">
                <i data-lucide={mobileMenuOpen ? "x" : "menu"} className="w-6 h-6"></i>
              </button>
            </div>

            {mobileMenuOpen && (
              <div className="md:hidden bg-neutral-950 border-b border-amber-500/20 p-4 space-y-3">
                <a href="#home" onClick={()=>setMobileMenuOpen(false)} className="block py-1 hover:text-amber-400">Home</a>
                <a href="#about" onClick={()=>setMobileMenuOpen(false)} className="block py-1 hover:text-amber-400">About</a>
                <a href="#services" onClick={()=>setMobileMenuOpen(false)} className="block py-1 hover:text-amber-400">Services</a>
                <a href="#reviews" onClick={()=>setMobileMenuOpen(false)} className="block py-1 hover:text-amber-400">Reviews</a>
                <a href="#location" onClick={()=>setMobileMenuOpen(false)} className="block py-1 hover:text-amber-400">Location</a>
                <button onClick={() => { setMobileMenuOpen(false); openBookingModal(); }} className="w-full py-3 rounded-lg bg-gold-gradient text-neutral-950 font-bold text-sm shadow-gold">
                  Book Appointment
                </button>
              </div>
            )}
          </header>

          {/* HERO SECTION */}
          <section id="home" className="relative py-20 lg:py-28 text-center bg-neutral-950 overflow-hidden">
            <div className="max-w-5xl mx-auto px-4 relative z-10">
              
              <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-neutral-900 border border-amber-500/30 text-amber-300 text-xs font-medium mb-6">
                <div className="flex gap-1">
                  {[...Array(5)].map((_, i) => (
                    <i key={i} data-lucide="star" className="w-3.5 h-3.5 fill-amber-400 text-amber-400"></i>
                  ))}
                </div>
                <span className="font-bold text-white">5.0</span>
                <span>•</span>
                <span>7 Verified Google Reviews</span>
              </div>

              <h1 className="font-serif-display text-4xl sm:text-6xl lg:text-7xl font-extrabold text-white tracking-tight leading-tight">
                CRAFTED CUTS. <br />
                <span className="text-gold-gradient">OLD SCHOOL MASTERY.</span>
              </h1>

              <p className="mt-6 text-lg sm:text-xl text-neutral-300 max-w-2xl mx-auto font-light">
                Welcome to <strong className="text-white">Cut Scene Barbershop</strong>. Kansas City’s trusted destination for classic fades, precision razor work, and traditional hot towel treatments by master barber <strong className="text-amber-400">Rocky</strong>.
              </p>

              <div className="mt-8 flex flex-wrap justify-center gap-4 text-xs text-neutral-400">
                <span className="bg-neutral-900 px-3 py-1.5 rounded-lg border border-neutral-800 flex items-center gap-1.5">
                  <i data-lucide="map-pin" className="w-4 h-4 text-amber-400"></i>
                  1600 Genessee St, Kansas City, MO 64102
                </span>
                <a href={`tel:${SHOP_INFO.phoneFormatted}`} className="bg-neutral-900 px-3 py-1.5 rounded-lg border border-neutral-800 flex items-center gap-1.5 text-amber-400 font-bold">
                  <i data-lucide="phone" className="w-4 h-4"></i>
                  (816) 474-3999
                </a>
              </div>

              <div className="mt-10 flex flex-col sm:flex-row justify-center gap-4 max-w-md mx-auto">
                <button onClick={() => openBookingModal()} className="w-full py-4 rounded-xl bg-gold-gradient text-neutral-950 font-bold text-lg shadow-gold hover:brightness-110 flex items-center justify-center gap-2">
                  <i data-lucide="calendar" className="w-5 h-5"></i>
                  <span>Book Appointment</span>
                </button>
                <a href={`tel:${SHOP_INFO.phoneFormatted}`} className="w-full py-4 rounded-xl bg-neutral-900 border border-neutral-700 text-white font-semibold text-lg flex items-center justify-center gap-2 hover:bg-neutral-850">
                  <i data-lucide="phone" className="w-5 h-5 text-amber-400"></i>
                  <span>Call (816) 474-3999</span>
                </a>
              </div>

              {/* AMENITIES BADGES */}
              <div className="mt-16 pt-8 border-t border-neutral-900 grid grid-cols-2 md:grid-cols-4 gap-4 text-left">
                <div className="bg-neutral-900/60 p-4 rounded-xl border border-neutral-850">
                  <h3 className="text-white text-sm font-semibold flex items-center gap-2">
                    <i data-lucide="scissors" className="w-4 h-4 text-amber-400"></i>
                    Old School Barber
                  </h3>
                  <p className="text-xs text-neutral-400 mt-1">Classic cuts with Rocky</p>
                </div>

                <div className="bg-neutral-900/60 p-4 rounded-xl border border-neutral-850">
                  <h3 className="text-white text-sm font-semibold flex items-center gap-2">
                    <i data-lucide="sparkles" className="w-4 h-4 text-amber-400"></i>
                    Clean as a Whistle
                  </h3>
                  <p className="text-xs text-neutral-400 mt-1">Spotless & sanitary shop</p>
                </div>

                <div className="bg-neutral-900/60 p-4 rounded-xl border border-neutral-850">
                  <h3 className="text-white text-sm font-semibold flex items-center gap-2">
                    <i data-lucide="heart" className="w-4 h-4 text-amber-400"></i>
                    Good for Kids
                  </h3>
                  <p className="text-xs text-neutral-400 mt-1">Friendly & welcoming</p>
                </div>

                <div className="bg-neutral-900/60 p-4 rounded-xl border border-neutral-850">
                  <h3 className="text-white text-sm font-semibold flex items-center gap-2">
                    <i data-lucide="shield-check" className="w-4 h-4 text-amber-400"></i>
                    Restroom On-Site
                  </h3>
                  <p className="text-xs text-neutral-400 mt-1">Full amenities available</p>
                </div>
              </div>

            </div>
          </section>

          {/* ABOUT SECTION */}
          <section id="about" className="py-20 bg-neutral-900/50 border-y border-neutral-850">
            <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
              
              <div className="lg:col-span-7 space-y-6">
                <span className="text-amber-400 text-xs uppercase font-bold tracking-wider">About Cut Scene</span>
                <h2 className="font-serif-display text-3xl sm:text-5xl font-bold text-white">
                  A Hidden Gem in <br />
                  <span className="text-gold-gradient">Kansas City, Missouri</span>
                </h2>

                <blockquote className="p-4 rounded-xl bg-neutral-950 border-l-4 border-amber-500 text-neutral-300 italic text-base">
                  &ldquo;Love this place …hidden gem in this part of town. Rocky is an old school barber…the way it used to be! Clean as a whistle…and got me cleaned up too…thanks Rocky!&rdquo;
                  <footer className="text-xs not-italic text-amber-400 mt-2 font-semibold">— Verified Google Review</footer>
                </blockquote>

                <p className="text-neutral-300 leading-relaxed text-sm sm:text-base">
                  Located at <strong>1600 Genessee St</strong> in Kansas City, <strong>Cut Scene</strong> was built on traditional barbering values: precision haircuts, warm hospitality, and genuine attention to detail. Master barber <strong>Rocky</strong> delivers time-honored shaves and modern fades in a spotless, family-friendly shop.
                </p>
              </div>

              <div className="lg:col-span-5 bg-neutral-950 p-8 rounded-2xl border border-amber-500/30 shadow-2xl space-y-4">
                <span className="text-amber-400 text-xs font-bold uppercase tracking-widest">Master Barber</span>
                <h3 className="font-serif-display text-2xl font-bold text-white">Rocky</h3>
                <p className="text-xs text-amber-300 font-semibold">25+ Years Barbering Experience</p>
                <p className="text-neutral-300 text-sm leading-relaxed italic">
                  &ldquo;Rocky is an old school barber in every sense of the word. Clean as a whistle and dedicated to classic precision.&rdquo;
                </p>
                <button onClick={() => openBookingModal()} className="w-full py-3 rounded-xl bg-gold-gradient text-neutral-950 font-bold text-sm shadow-gold mt-4">
                  Book Your Cut with Rocky
                </button>
              </div>

            </div>
          </section>

          {/* SERVICES SECTION */}
          <section id="services" className="py-20 bg-neutral-950">
            <div className="max-w-7xl mx-auto px-4">
              
              <div className="text-center max-w-2xl mx-auto space-y-3">
                <span className="text-amber-400 text-xs uppercase font-bold tracking-wider">Services & Pricing</span>
                <h2 className="font-serif-display text-3xl sm:text-5xl font-bold text-white">
                  BARBERING <span className="text-gold-gradient">MENU</span>
                </h2>
                <p className="text-neutral-400 text-sm">Every cut includes a consultation, hot towel, and straight razor line-up.</p>
              </div>

              {/* Category Filter Tabs */}
              <div className="mt-8 flex justify-center gap-2 flex-wrap">
                {[
                  { id: 'all', label: 'All Services' },
                  { id: 'cuts', label: 'Haircuts' },
                  { id: 'combos', label: 'Combos' },
                  { id: 'beards', label: 'Beards & Shaves' },
                  { id: 'kids', label: 'Kids & Seniors' }
                ].map((cat) => (
                  <button
                    key={cat.id}
                    onClick={() => setActiveCategory(cat.id)}
                    className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all ${
                      activeCategory === cat.id
                        ? 'bg-gold-gradient text-neutral-950 border-amber-400 shadow-gold'
                        : 'bg-neutral-900 text-neutral-300 border-neutral-800 hover:border-neutral-700'
                    }`}
                  >
                    {cat.label}
                  </button>
                ))}
              </div>

              {/* Services Cards */}
              <div className="mt-10 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredServices.map((srv) => (
                  <div key={srv.id} className="bg-neutral-900/90 rounded-2xl p-6 border border-neutral-800 hover:border-amber-500/40 flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-start mb-2">
                        <h3 className="font-serif-display text-lg font-bold text-white">{srv.name}</h3>
                        <span className="font-serif-display text-2xl font-black text-amber-400">${srv.price}</span>
                      </div>
                      <span className="text-xs text-neutral-400 block mb-3">⏱ {srv.duration}</span>
                      <p className="text-neutral-300 text-sm mb-6">{srv.description}</p>
                    </div>
                    <button onClick={() => openBookingModal(srv)} className="w-full py-2.5 rounded-lg bg-neutral-800 hover:bg-amber-500 hover:text-neutral-950 text-neutral-200 text-xs font-bold transition-all">
                      Book Now
                    </button>
                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* REVIEWS SECTION */}
          <section id="reviews" className="py-20 bg-neutral-900/40 border-t border-neutral-850">
            <div className="max-w-7xl mx-auto px-4">
              
              <div className="text-center max-w-2xl mx-auto space-y-3">
                <span className="text-amber-400 text-xs uppercase font-bold tracking-wider">5.0 Star Rated Barbershop</span>
                <h2 className="font-serif-display text-3xl sm:text-5xl font-bold text-white">
                  GOOGLE <span className="text-gold-gradient">REVIEWS</span>
                </h2>
                <p className="text-neutral-400 text-sm">Real feedback from Kansas City locals who trust Rocky.</p>
              </div>

              {/* Summary Dashboard */}
              <div className="mt-10 bg-neutral-950 rounded-2xl p-6 border border-amber-500/30 max-w-3xl mx-auto text-center sm:text-left flex flex-col sm:flex-row items-center justify-between gap-6">
                <div>
                  <div className="flex items-center gap-2 justify-center sm:justify-start">
                    <span className="font-serif-display text-5xl font-black text-amber-400">5.0</span>
                    <div>
                      <div className="flex gap-1 text-amber-400">
                        {[...Array(5)].map((_, i) => <i key={i} data-lucide="star" className="w-4 h-4 fill-amber-400"></i>)}
                      </div>
                      <span className="text-xs text-neutral-400">7 Google Reviews</span>
                    </div>
                  </div>
                  <p className="text-xs text-neutral-300 mt-2">100% 5-Star Rating on Google Maps</p>
                </div>

                <button onClick={() => setIsReviewOpen(true)} className="px-5 py-2.5 rounded-xl bg-neutral-900 border border-amber-500/40 text-amber-300 font-bold text-xs hover:border-amber-400">
                  + Leave A Review
                </button>
              </div>

              {/* Review Cards Grid */}
              <div className="mt-10 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {reviews.map((rev) => (
                  <div key={rev.id} className="bg-neutral-950 p-6 rounded-2xl border border-neutral-850 space-y-3">
                    <div className="flex justify-between items-center">
                      <h4 className="font-bold text-white text-sm">{rev.author}</h4>
                      <span className="text-[10px] text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded-full">Google Verified</span>
                    </div>
                    <div className="flex text-amber-400 gap-1">
                      {[...Array(rev.rating)].map((_, i) => <i key={i} data-lucide="star" className="w-3.5 h-3.5 fill-amber-400"></i>)}
                    </div>
                    <p className="text-neutral-300 text-sm italic">&ldquo;{rev.text}&rdquo;</p>
                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* LOCATION & MAP SECTION */}
          <section id="location" className="py-20 bg-neutral-950 border-t border-neutral-850">
            <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
              
              <div className="lg:col-span-5 space-y-6">
                <span className="text-amber-400 text-xs font-bold uppercase tracking-wider">Location & Hours</span>
                <h2 className="font-serif-display text-3xl font-bold text-white">VISIT CUT SCENE</h2>

                <div className="bg-neutral-900 p-6 rounded-2xl border border-neutral-800 space-y-4">
                  <div>
                    <span className="text-xs text-neutral-400 block uppercase">Address</span>
                    <h3 className="font-serif-display text-lg font-bold text-white">{SHOP_INFO.address}</h3>
                    <p className="text-neutral-300 text-sm">{SHOP_INFO.cityStateZip}</p>
                  </div>

                  <div>
                    <span className="text-xs text-neutral-400 block uppercase">Phone</span>
                    <a href={`tel:${SHOP_INFO.phoneFormatted}`} className="font-serif-display text-xl font-bold text-amber-400">
                      {SHOP_INFO.phone}
                    </a>
                  </div>

                  <div className="pt-4 border-t border-neutral-800 text-xs space-y-1">
                    <span className="text-neutral-400 block font-bold mb-2">Hours of Operation:</span>
                    {SHOP_INFO.hours.map((h, i) => (
                      <div key={i} className="flex justify-between">
                        <span className="text-neutral-300">{h.day}</span>
                        <span className="text-amber-300 font-mono">{h.hours}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              <div className="lg:col-span-7 bg-neutral-900 rounded-2xl border border-amber-500/30 overflow-hidden shadow-2xl">
                <div className="p-4 bg-neutral-950 border-b border-neutral-800 flex justify-between items-center">
                  <div>
                    <h3 className="font-serif-display text-base font-bold text-white">Map of Cut Scene</h3>
                    <p className="text-xs text-neutral-400">1600 Genessee St, Kansas City, MO 64102</p>
                  </div>
                  <a href={SHOP_INFO.googleMapDirectUrl} target="_blank" rel="noreferrer" className="px-3 py-1.5 rounded-lg bg-gold-gradient text-neutral-950 font-bold text-xs">
                    Get Directions
                  </a>
                </div>
                <iframe
                  title="Cut Scene Location Map"
                  src={SHOP_INFO.googleMapEmbedUrl}
                  width="100%"
                  height="380"
                  style={{ border: 0 }}
                  allowFullScreen
                  loading="lazy"
                ></iframe>
              </div>

            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-neutral-950 border-t border-amber-500/20 py-12 text-center text-xs text-neutral-500">
            <p className="font-serif-display text-lg font-bold text-gold-gradient mb-2">CUT SCENE BARBERSHOP</p>
            <p>1600 Genessee St, Kansas City, MO 64102 • (816) 474-3999</p>
            <p className="mt-4">© {new Date().getFullYear()} Cut Scene Barbershop. All rights reserved.</p>
          </footer>

          {/* BOOKING MODAL */}
          {isBookingOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-neutral-950 border border-amber-500/40 w-full max-w-xl rounded-2xl p-6 shadow-2xl space-y-4">
                
                <div className="flex justify-between items-center border-b border-neutral-800 pb-3">
                  <h3 className="font-serif-display text-lg font-bold text-white">
                    {bookingStep === 5 ? 'Booking Confirmed!' : 'Book An Appointment'}
                  </h3>
                  <button onClick={() => setIsBookingOpen(false)} className="text-neutral-400 hover:text-white">✕</button>
                </div>

                {bookingStep === 1 && (
                  <div className="space-y-3">
                    <h4 className="text-xs font-bold text-amber-400 uppercase">Select Service</h4>
                    {SERVICES.map(s => (
                      <button key={s.id} onClick={() => { setBookSrv(s); setBookingStep(2); }} className="w-full p-3 rounded-xl bg-neutral-900 border border-neutral-800 text-left flex justify-between hover:border-amber-400">
                        <div>
                          <span className="font-bold text-white text-sm block">{s.name}</span>
                          <span className="text-xs text-neutral-400">⏱ {s.duration}</span>
                        </div>
                        <span className="font-serif-display text-lg font-bold text-amber-400">${s.price}</span>
                      </button>
                    ))}
                  </div>
                )}

                {bookingStep === 2 && (
                  <form onSubmit={handleConfirmBooking} className="space-y-3">
                    <div className="bg-neutral-900 p-3 rounded-xl text-xs space-y-1">
                      <p className="text-amber-400 font-bold">{bookSrv.name} (${bookSrv.price})</p>
                      <p className="text-neutral-300">Barber: Rocky (Master Barber)</p>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-neutral-300 mb-1">Select Date</label>
                      <input type="date" value={bookDate} onChange={e=>setBookDate(e.target.value)} className="w-full p-2.5 rounded-xl bg-neutral-900 border border-neutral-800 text-white text-xs" />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-neutral-300 mb-1">Select Time</label>
                      <select value={bookTime} onChange={e=>setBookTime(e.target.value)} className="w-full p-2.5 rounded-xl bg-neutral-900 border border-neutral-800 text-white text-xs">
                        {['8:00 AM','9:00 AM','10:00 AM','11:00 AM','1:00 PM','2:00 PM','3:00 PM','4:00 PM','5:00 PM'].map(t=>(
                          <option key={t} value={t}>{t}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-neutral-300 mb-1">Your Full Name *</label>
                      <input type="text" required placeholder="John Smith" value={clientName} onChange={e=>setClientName(e.target.value)} className="w-full p-2.5 rounded-xl bg-neutral-900 border border-neutral-800 text-white text-xs" />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-neutral-300 mb-1">Phone Number *</label>
                      <input type="tel" required placeholder="(816) 555-0199" value={clientPhone} onChange={e=>setClientPhone(e.target.value)} className="w-full p-2.5 rounded-xl bg-neutral-900 border border-neutral-800 text-white text-xs" />
                    </div>

                    <button type="submit" className="w-full py-3 rounded-xl bg-gold-gradient text-neutral-950 font-bold text-sm shadow-gold">
                      Confirm Appointment
                    </button>
                  </form>
                )}

                {bookingStep === 5 && confirmedBooking && (
                  <div className="space-y-4 text-center py-4">
                    <div className="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center font-bold text-xl">✓</div>
                    <h4 className="font-serif-display text-xl font-bold text-white">See You Soon at Cut Scene!</h4>
                    <div className="bg-neutral-900 p-4 rounded-xl text-left text-xs space-y-1">
                      <p><span className="text-neutral-500">Ref Code:</span> <strong className="text-white">{confirmedBooking.id}</strong></p>
                      <p><span className="text-neutral-500">Service:</span> <strong className="text-amber-400">{confirmedBooking.serviceName} (${confirmedBooking.price})</strong></p>
                      <p><span className="text-neutral-500">Date & Time:</span> <strong className="text-white">{confirmedBooking.date} @ {confirmedBooking.time}</strong></p>
                      <p><span className="text-neutral-500">Location:</span> 1600 Genessee St, KC MO</p>
                    </div>
                    <button onClick={() => setIsBookingOpen(false)} className="w-full py-3 rounded-xl bg-gold-gradient text-neutral-950 font-bold text-sm">Done</button>
                  </div>
                )}

              </div>
            </div>
          )}

          {/* LEAVE REVIEW MODAL */}
          {isReviewOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-neutral-950 border border-amber-500/40 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-3">
                  <h3 className="font-serif-display text-lg font-bold text-white">Leave a Review</h3>
                  <button onClick={() => setIsReviewOpen(false)} className="text-neutral-400">✕</button>
                </div>

                {revSubmitted ? (
                  <p className="text-emerald-400 font-bold text-center py-6">Thank you! Your review was submitted.</p>
                ) : (
                  <form onSubmit={handleAddReview} className="space-y-3">
                    <div>
                      <label className="block text-xs font-bold text-neutral-300 mb-1">Your Name</label>
                      <input type="text" required value={revAuthor} onChange={e=>setRevAuthor(e.target.value)} className="w-full p-2.5 rounded-xl bg-neutral-900 border border-neutral-800 text-white text-xs" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-neutral-300 mb-1">Rating</label>
                      <select value={revRating} onChange={e=>setRevRating(Number(e.target.value))} className="w-full p-2.5 rounded-xl bg-neutral-900 border border-neutral-800 text-white text-xs">
                        <option value={5}>5 Stars ★★★★★</option>
                        <option value={4}>4 Stars ★★★★</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-neutral-300 mb-1">Your Review</label>
                      <textarea rows={3} required value={revText} onChange={e=>setRevText(e.target.value)} className="w-full p-2.5 rounded-xl bg-neutral-900 border border-neutral-800 text-white text-xs"></textarea>
                    </div>
                    <button type="submit" className="w-full py-3 rounded-xl bg-gold-gradient text-neutral-950 font-bold text-sm">Submit Review</button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* MY BOOKINGS MODAL */}
          {isMyBookingsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-neutral-950 border border-amber-500/40 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-3">
                  <h3 className="font-serif-display text-lg font-bold text-white">Your Appointments</h3>
                  <button onClick={() => setIsMyBookingsOpen(false)} className="text-neutral-400">✕</button>
                </div>

                <div className="space-y-3 max-h-80 overflow-y-auto">
                  {bookings.length === 0 ? (
                    <p className="text-xs text-neutral-400 text-center py-6">No scheduled appointments found.</p>
                  ) : (
                    bookings.map(b => (
                      <div key={b.id} className="bg-neutral-900 p-4 rounded-xl border border-neutral-800 text-xs space-y-1">
                        <div className="flex justify-between font-bold text-white">
                          <span>{b.serviceName}</span>
                          <span className="text-amber-400">${b.price}</span>
                        </div>
                        <p className="text-neutral-300">{b.date} @ {b.time}</p>
                        <p className="text-neutral-400">Client: {b.clientName} ({b.clientPhone})</p>
                      </div>
                    ))
                  )}
                </div>

                <button onClick={() => setIsMyBookingsOpen(false)} className="w-full py-2.5 rounded-xl bg-neutral-800 text-white text-xs font-bold">
                  Close Window
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
